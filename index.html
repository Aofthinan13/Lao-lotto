<script>

const statisticPool=[
7,7,7,7,
4,4,4,
8,8,8,
1,1,1,
2,2,
5,5,
0,3,6,9
];

function getWeightedRandomNumber(){

const randomIndex=
Math.floor(
Math.random()*statisticPool.length
);

return statisticPool[randomIndex];

}

function getTodayString(){

const today=new Date();

return today.toISOString().split("T")[0];

}

function generate4Digits(){

let number="";

for(let i=0;i<4;i++){

number+=getWeightedRandomNumber();

}

return number;

}


function showResult(fullNumber){

document.getElementById(
'num-1'
).innerText=
fullNumber[0];

document.getElementById(
'num-2'
).innerText=
fullNumber[1];

document.getElementById(
'num-3'
).innerText=
fullNumber[2];

document.getElementById(
'num-4'
).innerText=
fullNumber[3];

}


function checkDailyLimit(){

const today=
getTodayString();

try{

const twoData=
JSON.parse(
localStorage.getItem(
'laoLotto_2digits'
)
);

const threeData=
JSON.parse(
localStorage.getItem(
'laoLotto_3digits'
)
);


if(
twoData &&
twoData.date===today
){

document.getElementById(
'btn-2digits'
).disabled=true;

showResult(
twoData.full
);

document.getElementById(
'result'
).innerHTML=
`
เลขหน้า 2 ตัว:
<b>${twoData.front2}</b>
`;

}


if(
threeData &&
threeData.date===today
){

document.getElementById(
'btn-3digits'
).disabled=true;

showResult(
threeData.full
);

document.getElementById(
'result'
).innerHTML=
`
เลขท้าย 3 ตัว:
<b>${threeData.back3}</b>
`;

}

}catch(e){

console.log(e);

}

}


function predictLaoLotto(type){

document.getElementById(
'predict-type'
).innerText=
"⏳ กำลังวิเคราะห์...";


setTimeout(()=>{

const full=
generate4Digits();

const front2=
full.substring(0,2);

const back3=
full.substring(1,4);


showResult(full);

const data={

date:getTodayString(),

full:full,

front2:front2,

back3:back3

};


if(type===2){

localStorage.setItem(

'laoLotto_2digits',

JSON.stringify(data)

);

document.getElementById(
'btn-2digits'
).disabled=true;

document.getElementById(
'result'
).innerHTML=
`
เลขหน้า 2 ตัว:
<b>${front2}</b>
`;

}


if(type===3){

localStorage.setItem(

'laoLotto_3digits',

JSON.stringify(data)

);

document.getElementById(
'btn-3digits'
).disabled=true;

document.getElementById(
'result'
).innerHTML=
`
เลขท้าย 3 ตัว:
<b>${back3}</b>
`;

}


document.getElementById(
'predict-type'
).innerText=
"✅ บันทึกเรียบร้อย";

},1000);

}

document.addEventListener(
'DOMContentLoaded',
checkDailyLimit
);

</script>
