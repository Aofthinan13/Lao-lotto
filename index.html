<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lao Lotto Predictor</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Prompt',sans-serif;
}
</style>

</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

<header class="bg-gray-800 border-b border-gray-700 py-4 text-center">
<h1 class="text-2xl font-bold text-red-500">
🇱🇦 LAO LOTTO PREDICTOR
</h1>

<p class="text-gray-400 text-sm">
วิเคราะห์เลขลาว
</p>
</header>

<main class="flex-grow max-w-md mx-auto p-4">

<div class="bg-gray-800 rounded-2xl p-6 text-center mb-6">

<h2 class="text-sm text-gray-400 mb-4">
เลขเด่นประจำวัน
</h2>

<div class="flex justify-center gap-4">

<div id="num-1"
class="w-14 h-14 rounded-full bg-red-500 flex items-center justify-center text-2xl font-bold">
-
</div>

<div id="num-2"
class="w-14 h-14 rounded-full bg-red-500 flex items-center justify-center text-2xl font-bold">
-
</div>

<div id="num-3"
class="w-14 h-14 rounded-full bg-red-500 flex items-center justify-center text-2xl font-bold opacity-50">
-
</div>

</div>

<p id="predict-type"
class="mt-4 text-yellow-400">
พร้อมวิเคราะห์
</p>

</div>

<button
id="btn-2digits"
onclick="predictLaoLotto(2)"
class="w-full bg-red-600 p-4 rounded-2xl mb-3 font-bold">

📊 วิเคราะห์เลข 2 ตัว
(1 ครั้ง/วัน)

</button>

<button
id="btn-3digits"
onclick="predictLaoLotto(3)"
class="w-full bg-blue-600 p-4 rounded-2xl font-bold">

🌟 วิเคราะห์เลข 3 ตัว
(1 ครั้ง/วัน)

</button>

</main>

<script>

const statisticPool=[
7,7,7,7,
4,4,4,
8,8,8,
1,1,1,
2,2,
5,5,
0,3,6,9
];

function getWeightedRandomNumber(){

const randomIndex=
Math.floor(
Math.random()*statisticPool.length
);

return statisticPool[randomIndex];

}

function getTodayString(){

const today=new Date();

const year=today.getFullYear();

const month=
String(
today.getMonth()+1
).padStart(2,'0');

const day=
String(
today.getDate()
).padStart(2,'0');

return `${year}-${month}-${day}`;

}


function displayNumbers(data){

document.getElementById(
'num-1'
).innerText=data.n1;

document.getElementById(
'num-2'
).innerText=data.n2;

document.getElementById(
'num-3'
).innerText=data.n3;

if(data.n3=="-"){

document.getElementById(
'num-3'
).classList.add(
'opacity-50'
);

}else{

document.getElementById(
'num-3'
).classList.remove(
'opacity-50'
);

}

}


function checkDailyLimit(){

const todayStr=
getTodayString();

try{

const twoData=
JSON.parse(
localStorage.getItem(
'laoLotto_2digits'
)
);

const threeData=
JSON.parse(
localStorage.getItem(
'laoLotto_3digits'
)
);


if(
twoData &&
twoData.date===todayStr
){

document.getElementById(
'btn-2digits'
).disabled=true;

displayNumbers(twoData);

}


if(
threeData &&
threeData.date===todayStr
){

document.getElementById(
'btn-3digits'
).disabled=true;

displayNumbers(threeData);

}


if(
(twoData &&
twoData.date===todayStr)
&&
(threeData &&
threeData.date===todayStr)
){

document.getElementById(
'predict-type'
).innerText=
"🔒 วันนี้ใช้สิทธิ์ครบแล้ว";

}

}catch(error){

localStorage.removeItem(
'laoLotto_2digits'
);

localStorage.removeItem(
'laoLotto_3digits'
);

}

}


function predictLaoLotto(
digits
){

const num1=
document.getElementById(
'num-1'
);

const num2=
document.getElementById(
'num-2'
);

const num3=
document.getElementById(
'num-3'
);

const predictType=
document.getElementById(
'predict-type'
);

predictType.innerText=
"⏳ กำลังวิเคราะห์...";

num1.innerText="⚡";
num2.innerText="⚡";
num3.innerText=
digits===3?"⚡":"-";


setTimeout(()=>{

const n1=
getWeightedRandomNumber();

const n2=
getWeightedRandomNumber();

let n3="-";

if(digits===3){

n3=
getWeightedRandomNumber();

}


const saveState={

date:getTodayString(),

n1:n1,
n2:n2,
n3:n3

};


displayNumbers(
saveState
);


if(digits===2){

localStorage.setItem(

'laoLotto_2digits',

JSON.stringify(
saveState
)

);

document.getElementById(
'btn-2digits'
).disabled=true;

}


if(digits===3){

localStorage.setItem(

'laoLotto_3digits',

JSON.stringify(
saveState
)

);

document.getElementById(
'btn-3digits'
).disabled=true;

}


predictType.innerText=
"✅ บันทึกเรียบร้อย";

},1000);

}


document.addEventListener(

'DOMContentLoaded',

checkDailyLimit

);

</script>

</body>
</html>
