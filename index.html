<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lottery Statistics Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
<h1>📊 Lottery Statistics Dashboard</h1>

<input id="drawDate" type="date">
<input id="resultInput" type="text" maxlength="4" placeholder="ผล 4 หลัก">
<button onclick="addResult()">เพิ่มข้อมูล</button>
<button onclick="exportData()">Export JSON</button>
<input type="file" id="importFile">

<input id="searchBox" placeholder="ค้นหา">

<table id="resultsTable">
<thead><tr><th>วันที่</th><th>ผล</th><th>ลบ</th></tr></thead>
<tbody></tbody>
</table>

<h2>ความถี่เลข 0-9</h2>
<div id="stats"></div>

<canvas id="digitChart"></canvas>
</div>
<script src="app.js"></script>
</body>
</html>
